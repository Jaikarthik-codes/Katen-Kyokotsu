services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: backend/.env
    environment:
      # Inside the compose network the database host is "db", not localhost.
      DATABASE_URL: postgresql+psycopg://portfolio:portfolio@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Content lives in the repo's seed/ folder: `docker compose exec api python -m app.seed`
      - ./seed:/seed:ro
    ports:
      - "8000:8000"

volumes:
  pgdata:
