[project]
name = "portfolio-api"
version = "0.1.0"
description = "FastAPI + PostgreSQL API behind the ASCII-3D portfolio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "email-validator>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
